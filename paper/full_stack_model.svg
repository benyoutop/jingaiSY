<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 30px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .subtitle { font: 600 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #222222; }
      .label { font: 600 17px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .text { font: 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #333333; }
      .small { font: 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #444444; }
      .layer { fill: #fbfbfb; stroke: #4a4a4a; stroke-width: 1.8; rx: 24; ry: 24; }
      .block-blue { fill: #f3f3f3; stroke: #444444; stroke-width: 1.8; rx: 18; ry: 18; }
      .block-green { fill: #f3f3f3; stroke: #444444; stroke-width: 1.8; rx: 18; ry: 18; }
      .block-orange { fill: #f3f3f3; stroke: #444444; stroke-width: 1.8; rx: 18; ry: 18; }
      .block-purple { fill: #f3f3f3; stroke: #444444; stroke-width: 1.8; rx: 18; ry: 18; }
      .block-gray { fill: #f3f3f3; stroke: #444444; stroke-width: 1.8; rx: 18; ry: 18; }
      .dash { stroke-dasharray: 8 8; }
      .arrow { stroke: #333333; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #333333; stroke-width: 2.6; fill: none; marker-end: url(#arrow2); }
      .arrow3 { stroke: #333333; stroke-width: 2.6; fill: none; marker-end: url(#arrow3); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#333333"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#333333"/>
    </marker>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1560" height="940" fill="#ffffff" stroke="#444444" stroke-width="1.6" rx="28" ry="28"/>
  <text x="800" y="70" text-anchor="middle" class="title">智慧井盖监控系统全栈模型图</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle">终端感知层 - 边缘控制层 - 通信传输层 - Fastify 后端层 - Vue 3 前端层</text>

  <rect class="layer" x="50" y="140" width="250" height="720"/>
  <text x="175" y="182" text-anchor="middle" class="subtitle">感知层</text>

  <rect class="block-green" x="78" y="220" width="194" height="88"/>
  <text x="175" y="255" text-anchor="middle" class="label">超声波测距模块</text>
  <text x="175" y="282" text-anchor="middle" class="small">井盖高度 / 开盖状态</text>

  <rect class="block-green" x="78" y="332" width="194" height="88"/>
  <text x="175" y="367" text-anchor="middle" class="label">MPU6050 姿态模块</text>
  <text x="175" y="394" text-anchor="middle" class="small">倾斜 / 振动 / 扰动检测</text>

  <rect class="block-green" x="78" y="444" width="194" height="88"/>
  <text x="175" y="479" text-anchor="middle" class="label">MQ-2 烟雾模块</text>
  <text x="175" y="506" text-anchor="middle" class="small">烟雾浓度 / 报警状态</text>

  <rect class="block-green" x="78" y="556" width="194" height="88"/>
  <text x="175" y="591" text-anchor="middle" class="label">GPS 定位模块</text>
  <text x="175" y="618" text-anchor="middle" class="small">经纬度 / UTC / 卫星数</text>

  <rect class="block-green" x="78" y="668" width="194" height="88"/>
  <text x="175" y="703" text-anchor="middle" class="label">本地告警设备</text>
  <text x="175" y="730" text-anchor="middle" class="small">LED 指示灯 / 蜂鸣器</text>

  <rect class="layer" x="340" y="140" width="310" height="720"/>
  <text x="495" y="182" text-anchor="middle" class="subtitle">边缘控制层</text>

  <rect class="block-blue" x="380" y="235" width="230" height="120"/>
  <text x="495" y="275" text-anchor="middle" class="label">STM32F103 主控终端</text>
  <text x="495" y="304" text-anchor="middle" class="text">外设初始化 / 周期采样</text>
  <text x="495" y="330" text-anchor="middle" class="text">串口解析 / 数据缓存</text>

  <rect class="block-blue" x="380" y="402" width="230" height="118"/>
  <text x="495" y="442" text-anchor="middle" class="label">边缘判定与告警逻辑</text>
  <text x="495" y="471" text-anchor="middle" class="text">阈值判定 / 状态融合</text>
  <text x="495" y="497" text-anchor="middle" class="text">本地声光告警联动</text>

  <rect class="block-blue" x="380" y="566" width="230" height="126"/>
  <text x="495" y="606" text-anchor="middle" class="label">遥测打包与任务调度</text>
  <text x="495" y="635" text-anchor="middle" class="text">HTTP 参数组织</text>
  <text x="495" y="661" text-anchor="middle" class="text">定时上传 / 失败重试</text>

  <rect class="layer" x="690" y="140" width="250" height="720"/>
  <text x="815" y="182" text-anchor="middle" class="subtitle">通信传输层</text>

  <rect class="block-orange" x="718" y="280" width="194" height="98"/>
  <text x="815" y="320" text-anchor="middle" class="label">ESP8266 WiFi 模块</text>
  <text x="815" y="349" text-anchor="middle" class="small">AT 指令 / TCP 连接</text>

  <rect class="block-orange" x="718" y="430" width="194" height="98"/>
  <text x="815" y="470" text-anchor="middle" class="label">无线接入网络</text>
  <text x="815" y="499" text-anchor="middle" class="small">路由器 / Internet / HTTP</text>

  <rect class="block-orange" x="718" y="580" width="194" height="98"/>
  <text x="815" y="620" text-anchor="middle" class="label">远程传输链路</text>
  <text x="815" y="649" text-anchor="middle" class="small">遥测上传 / 状态回传</text>

  <rect class="layer" x="980" y="140" width="310" height="720"/>
  <text x="1135" y="182" text-anchor="middle" class="subtitle">Node.js + Fastify 后端层</text>

  <rect class="block-purple" x="1020" y="210" width="230" height="96"/>
  <text x="1135" y="248" text-anchor="middle" class="label">Fastify API 服务</text>
  <text x="1135" y="276" text-anchor="middle" class="small">HTTP 接口 / 参数校验 / 路由分发</text>

  <rect class="block-purple" x="1020" y="342" width="230" height="96"/>
  <text x="1135" y="380" text-anchor="middle" class="label">遥测处理与事件服务</text>
  <text x="1135" y="408" text-anchor="middle" class="small">设备识别 / GPS 补偿 / SSE 推送</text>

  <rect class="block-purple" x="1020" y="474" width="230" height="96"/>
  <text x="1135" y="512" text-anchor="middle" class="label">数据存储与日志层</text>
  <text x="1135" y="540" text-anchor="middle" class="small">JSONL 历史记录 / 事件日志 / 调试追踪</text>

  <rect class="block-purple" x="1020" y="606" width="230" height="96"/>
  <text x="1135" y="644" text-anchor="middle" class="label">查询与运维接口</text>
  <text x="1135" y="672" text-anchor="middle" class="small">历史查询 / 健康检查 / 状态回传</text>

  <rect class="layer" x="1330" y="140" width="220" height="720"/>
  <text x="1440" y="182" text-anchor="middle" class="subtitle">Vue 3 前端层</text>

  <rect class="block-gray" x="1360" y="255" width="160" height="108"/>
  <text x="1440" y="295" text-anchor="middle" class="label">Vue Web 监控平台</text>
  <text x="1440" y="324" text-anchor="middle" class="small">状态总览 / 图表展示</text>
  <text x="1440" y="347" text-anchor="middle" class="small">设备检索 / 历史查询</text>

  <rect class="block-gray" x="1360" y="420" width="160" height="108"/>
  <text x="1440" y="460" text-anchor="middle" class="label">Vue 运维页面</text>
  <text x="1440" y="489" text-anchor="middle" class="small">异常提醒 / 设备详情</text>
  <text x="1440" y="512" text-anchor="middle" class="small">状态处置 / 结果反馈</text>

  <rect class="block-gray" x="1360" y="585" width="160" height="108"/>
  <text x="1440" y="625" text-anchor="middle" class="label">Vue 分析看板</text>
  <text x="1440" y="654" text-anchor="middle" class="small">统计分析 / 状态汇总</text>
  <text x="1440" y="677" text-anchor="middle" class="small">告警记录 / 运维评估</text>

  <path class="arrow" d="M272 264 C320 264, 330 264, 380 295"/>
  <path class="arrow" d="M272 376 C320 376, 330 376, 380 295"/>
  <path class="arrow" d="M272 488 C320 488, 330 488, 380 461"/>
  <path class="arrow" d="M272 600 C320 600, 330 600, 380 629"/>
  <path class="arrow3" d="M610 295 C655 295, 670 295, 718 329"/>
  <path class="arrow3" d="M610 629 C655 629, 670 629, 718 629"/>
  <path class="arrow" d="M610 461 C655 461, 670 461, 718 479"/>
  <path class="arrow2" d="M272 712 C330 712, 340 712, 380 461"/>
  <path class="arrow" d="M912 329 C955 329, 970 260, 1020 258"/>
  <path class="arrow" d="M912 479 C955 479, 970 390, 1020 390"/>
  <path class="arrow" d="M912 629 C955 629, 970 520, 1020 522"/>
  <path class="arrow" d="M1250 258 C1300 258, 1312 309, 1360 309"/>
  <path class="arrow" d="M1250 390 C1300 390, 1312 474, 1360 474"/>
  <path class="arrow" d="M1250 654 C1300 654, 1312 639, 1360 639"/>
  <path class="arrow2 dash" d="M1360 474 C1305 474, 1290 654, 1250 654"/>
  <path class="arrow2 dash" d="M1360 309 C1305 309, 1290 390, 1250 390"/>

  <rect x="1020" y="760" width="500" height="74" fill="#ffffff" stroke="#555555" stroke-width="1.2" rx="16" ry="16"/>
  <text x="1270" y="790" text-anchor="middle" class="label">数据闭环说明</text>
  <text x="1270" y="818" text-anchor="middle" class="small">终端感知数据经 STM32 边缘处理后，通过 ESP8266 接入网络并上传至 Fastify 后端；</text>
  <text x="1270" y="840" text-anchor="middle" class="small">后端完成接收、校验、存储与实时推送，Vue 3 前端提供可视化监控、运维处置与决策支撑。</text>
</svg>
