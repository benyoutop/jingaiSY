<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <style>
      .title { font: 700 28px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .label { font: 600 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111111; }
      .box { fill: #f7f7f7; stroke: #444444; stroke-width: 2.2; rx: 18; ry: 18; }
      .decision { fill: #ffffff; stroke: #333333; stroke-width: 2.2; }
      .arrow { stroke: #333333; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .note { font: 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #444444; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="860" rx="24" ry="24" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="450" y="68" text-anchor="middle" class="title">终端软件主循环流程图</text>

  <rect class="box" x="255" y="105" width="390" height="72"/>
  <text x="450" y="149" text-anchor="middle" class="label">系统初始化</text>

  <rect class="box" x="255" y="215" width="390" height="72"/>
  <text x="450" y="259" text-anchor="middle" class="label">GPS 语句解析</text>

  <rect class="box" x="255" y="325" width="390" height="72"/>
  <text x="450" y="369" text-anchor="middle" class="label">MPU6050 周期采样</text>

  <rect class="box" x="255" y="435" width="390" height="72"/>
  <text x="450" y="479" text-anchor="middle" class="label">MQ-2 周期采样</text>

  <rect class="box" x="255" y="545" width="390" height="72"/>
  <text x="450" y="589" text-anchor="middle" class="label">超声波测距与距离计算</text>

  <polygon class="decision" points="450,655 610,710 450,765 290,710"/>
  <text x="450" y="716" text-anchor="middle" class="label">WiFi 连接正常？</text>

  <rect class="box" x="675" y="674" width="140" height="72"/>
  <text x="745" y="718" text-anchor="middle" class="label">执行重连</text>

  <rect class="box" x="255" y="800" width="390" height="72"/>
  <text x="450" y="844" text-anchor="middle" class="label">打包数据并 HTTP 上传</text>

  <path class="arrow" d="M450 177 L450 215"/>
  <path class="arrow" d="M450 287 L450 325"/>
  <path class="arrow" d="M450 397 L450 435"/>
  <path class="arrow" d="M450 507 L450 545"/>
  <path class="arrow" d="M450 617 L450 655"/>
  <path class="arrow" d="M610 710 L675 710"/>
  <path class="arrow" d="M450 765 L450 800"/>
  <path class="arrow" d="M255 836 C145 836, 120 141, 255 141"/>
  <path class="arrow" d="M745 746 C745 780, 690 790, 645 800"/>

  <text x="624" y="700" class="note">否</text>
  <text x="464" y="786" class="note">是</text>
  <text x="138" y="820" class="note">下一轮循环</text>
</svg>
