<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <style>
      .subtitle { font: 600 20px "Times New Roman", "Noto Serif SC", serif; fill: #111; }
      .label { font: 600 18px "Times New Roman", "Noto Serif SC", serif; fill: #111; }
      .text { font: 15px "Times New Roman", "Noto Serif SC", serif; fill: #222; }
      .small { font: 14px "Times New Roman", "Noto Serif SC", serif; fill: #333; }
      .frame { fill: #fff; stroke: #222; stroke-width: 1.8; rx: 18; ry: 18; }
      .layer { fill: #fff; stroke: #222; stroke-width: 1.8; rx: 16; ry: 16; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.4; rx: 12; ry: 12; }
      .arrow { stroke: #222; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="70" y="130" width="340" height="620" class="layer"/>
  <text x="240" y="172" text-anchor="middle" class="subtitle">Perception and Edge Layer</text>

  <rect x="112" y="228" width="256" height="108" class="box"/>
  <text x="240" y="268" text-anchor="middle" class="label">Multi-source Sensing Unit</text>
  <text x="240" y="298" text-anchor="middle" class="small">Water level, attitude, smoke and GPS</text>

  <rect x="112" y="392" width="256" height="108" class="box"/>
  <text x="240" y="432" text-anchor="middle" class="label">STM32 Edge Controller</text>
  <text x="240" y="468" text-anchor="middle" class="small">Acquisition and edge judgment</text>

  <rect x="112" y="556" width="256" height="108" class="box"/>
  <text x="240" y="596" text-anchor="middle" class="label">Local Alarm Unit</text>
  <text x="240" y="626" text-anchor="middle" class="small">On-site warning</text>

  <rect x="500" y="130" width="250" height="620" class="layer"/>
  <text x="625" y="172" text-anchor="middle" class="subtitle">Communication Layer</text>

  <rect x="538" y="310" width="174" height="112" class="box"/>
  <text x="625" y="352" text-anchor="middle" class="label">ESP8266 and WiFi</text>
  <text x="625" y="382" text-anchor="middle" class="small">Wireless upload</text>

  <rect x="840" y="130" width="320" height="620" class="layer"/>
  <text x="1000" y="172" text-anchor="middle" class="subtitle">Backend Service Layer</text>

  <rect x="880" y="228" width="240" height="120" class="box"/>
  <text x="1000" y="272" text-anchor="middle" class="label">Fastify API Service</text>
  <text x="1000" y="302" text-anchor="middle" class="small">Data reception</text>

  <rect x="880" y="410" width="240" height="120" class="box"/>
  <text x="1000" y="454" text-anchor="middle" class="label">Data Processing and Storage</text>
  <text x="1000" y="484" text-anchor="middle" class="small">Processing and storage</text>

  <rect x="1240" y="130" width="290" height="620" class="layer"/>
  <text x="1385" y="172" text-anchor="middle" class="subtitle">Frontend Presentation Layer</text>

  <rect x="1280" y="310" width="210" height="112" class="box"/>
  <text x="1385" y="352" text-anchor="middle" class="label">Vue 3 Monitoring Interface</text>
  <text x="1385" y="382" text-anchor="middle" class="small">Visualization and records</text>

  <path d="M240 336 L240 392" class="arrow"/>
  <path d="M240 500 L240 556" class="arrow dashed"/>
  <path d="M368 446 C430 446, 458 446, 538 366" class="arrow"/>
  <path d="M712 366 C770 366, 800 290, 880 288" class="arrow"/>
  <path d="M1000 348 L1000 410" class="arrow"/>
  <path d="M1120 470 C1180 470, 1210 366, 1280 366" class="arrow"/>
  <path d="M1280 392 C1210 392, 1180 520, 1120 520" class="arrow dashed"/>

  <text x="452" y="420" text-anchor="middle" class="text">Structured telemetry data</text>
  <text x="800" y="258" text-anchor="middle" class="text">HTTP request</text>
  <text x="1198" y="334" text-anchor="middle" class="text">Processed status data</text>
  <text x="1198" y="560" text-anchor="middle" class="text">Query and event feedback</text>
  <text x="286" y="532" text-anchor="middle" class="text">Local alarm trigger</text>
</svg>
